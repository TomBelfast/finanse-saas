services:
  # MariaDB Database (OPCJONALNE - tylko jeśli chcesz lokalną bazę)
  # Jeśli używasz zewnętrznej bazy danych, zakomentuj tę sekcję i ustaw DB_HOST w backendzie
  # mariadb:
  #   image: mariadb:11.3
  #   container_name: finanse-mariadb
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
  #     MYSQL_DATABASE: ${DB_NAME:-Finanse}
  #     MYSQL_USER: ${DB_USER:-Saas}
  #     MYSQL_PASSWORD: ${DB_PASSWORD:-Finanse2025}
  #   ports:
  #     - "${DB_PORT:-3306}:3306"
  #   volumes:
  #     - mariadb_data:/var/lib/mysql
  #     - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
  #   healthcheck:
  #     test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - finanse-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: apps/functions/Dockerfile
      args:
        # Override NODE_ENV from Coolify - we need development during build
        # Coolify passes NODE_ENV=production, but we need devDependencies for building
        NODE_ENV: development
    container_name: finanse-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3015}:3015"
    environment:
      # Database - ZEWNĘTRZNA BAZA DANYCH (zmień DB_HOST na IP swojej bazy)
      USE_MARIADB: "true"
      DB_HOST: ${DB_HOST:-192.168.0.9}  # Ustaw IP zewnętrznej bazy danych
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-Saas}
      DB_PASSWORD: ${DB_PASSWORD:-Finanse2025}
      DB_NAME: ${DB_NAME:-Finanse}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      
      # Server
      PORT: 3015
      NODE_ENV: production
      
      # Clerk (REQUIRED - set these in Coolify environment variables)
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      
      # CORS (set your frontend URL)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://finanse.aihub.ovh,https://www.finanse.aihub.ovh}
      
      # Optional integrations - Redis
      REDIS_URL: ${REDIS_URL:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      
      # Other optional services
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      POSTMARK_API_KEY: ${POSTMARK_API_KEY:-}
    # depends_on:
    #   mariadb:
    #     condition: service_healthy
    # Zakomentowane, jeśli używasz zewnętrznej bazy danych
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3015/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - finanse-network

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: apps/web-app/Dockerfile
      args:
        # Override NODE_ENV from Coolify - we need development during build
        # Coolify passes NODE_ENV=production, but we need devDependencies for building
        NODE_ENV: development
        VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
        # IMPORTANT: Set VITE_API_URL to backend URL (either direct port or subdomain)
        # Option 1: Use backend subdomain (recommended): https://api.finanse.aihub.ovh/api
        # Option 2: Use direct port (if accessible): http://finanse.aihub.ovh:3015/api
        # Note: In Coolify, configure backend to have its own domain (e.g., api.finanse.aihub.ovh -> port 3015)
        VITE_API_URL: ${VITE_API_URL:-https://api.finanse.aihub.ovh/api}
        VITE_DEBUG: ${VITE_DEBUG:-false}
    container_name: finanse-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3005}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - finanse-network

volumes:
  mariadb_data:
    driver: local

networks:
  finanse-network:
    driver: bridge

